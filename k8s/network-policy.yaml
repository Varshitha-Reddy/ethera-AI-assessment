apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ethera-api, namespace: ethera}
spec:
  podSelector: {matchLabels: {app: ethera-api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
      ports: [{protocol: TCP, port: 8000}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}}]
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}, {protocol: TCP, port: 5432}, {protocol: TCP, port: 6379}, {protocol: TCP, port: 9092}, {protocol: TCP, port: 4317}, {protocol: TCP, port: 443}]
