apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: {name: vault, namespace: ethera}
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "kv"
      version: "v2"
      auth:
        kubernetes: {mountPath: kubernetes, role: ethera-api, serviceAccountRef: {name: ethera-api}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: ethera-secrets, namespace: ethera}
spec:
  refreshInterval: 15m
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: ethera-secrets, creationPolicy: Owner}
  data:
    - {secretKey: DATABASE_URL, remoteRef: {key: ethera/production, property: database_url}}
    - {secretKey: READ_DATABASE_URL, remoteRef: {key: ethera/production, property: read_database_url}}
    - {secretKey: REDIS_URL, remoteRef: {key: ethera/production, property: redis_url}}
    - {secretKey: KAFKA_BROKERS, remoteRef: {key: ethera/production, property: kafka_brokers}}
    - {secretKey: JWT_SECRET, remoteRef: {key: ethera/production, property: jwt_secret}}
    - {secretKey: SENTRY_DSN, remoteRef: {key: ethera/production, property: sentry_dsn}}
